tool: jscpd
language: javascript
language_version: "22"
technique: "Code Quality Auditing"
classification: "Code Duplication Detection"
target_files: [../../src/app.js, ../../src/app.js]
run:
  command: "npx jscpd --min-lines 3 --min-tokens 20 --reporters console src/"
expects:
  duplicate_clone_detected: true
verified_in_session: true
verified_result: "1 real clone found: 3 lines / 39 tokens, between the customer and admin products route handlers in app.js — a genuine structural near-duplicate from the two namespaces sharing a response shape"
